{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>{{ package.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            font-family:Poppins;
            background:#f5f5f5;
        }

        .hero-image{
            width:100%;
            height:500px;
            object-fit:cover;
            border-radius:20px;
        }

        .package-box{
            background:#fff;
            padding:30px;
            border-radius:20px;
            margin-top:30px;
        }

        .price{
            font-size:40px;
            font-weight:700;
        }

        .book-btn{
            background:red;
            color:white;
            padding:15px 35px;
            border:none;
            border-radius:10px;
            font-size:20px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <img src="{{ package.image.url }}"
         class="hero-image">

    <div class="package-box">

        <h1>
            {{ package.title }}
        </h1>

        <p>
            ⭐ {{ package.rating }}
            ({{ package.total_reviews }})
        </p>

        <h3>
            Duration :
            {{ package.duration }}
        </h3>

        <h3>
            Best Month :
            {{ package.month }}
        </h3>

        <div class="price">
            ₹{{ package.price }}
        </div>

        <p class="mt-4">
            {{ package.description }}
        </p>

        <button class="book-btn">
            Book Now
        </button>

    </div>

</div>

</body>
</html>
