<!DOCTYPE html>
<html>

<head>

    <title>
        Booking Summary
    </title>

    <style>

        body{
            font-family:Poppins;
            background:#f5f5f5;
        }

        .box{
            width:700px;
            margin:auto;
            margin-top:50px;
            background:#fff;
            padding:40px;
            border-radius:15px;
        }

        .price{
            font-size:40px;
            font-weight:700;
            color:red;
        }

        .btn{
            background:red;
            color:white;
            padding:15px 40px;
            border:none;
            border-radius:10px;
            margin-top:30px;
            font-size:20px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        Booking Summary
    </h1>

    <h2>
        {{ package.title }}
    </h2>

    <p>
        Adults :
        {{ booking.adults }}
    </p>

    <p>
        Children :
        {{ booking.children }}
    </p>

    <p>
        Infants :
        {{ booking.infants }}
    </p>

    <p>
        Travel Date :
        {{ booking.travel_date }}
    </p>

    <hr>

    <p>
        Subtotal :
        ₹{{ subtotal }}
    </p>

    <p>
        GST :
        ₹{{ gst }}
    </p>

    <div class="price">

        ₹{{ grand_total }}

    </div>

    <button class="btn">

        Continue To Payment

    </button>

</div>

</body>
</html>
